name: MEDIATA FRONTEND CI

on:
  push:
    branches: [dev, main]

permissions:
  contents: write

jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Build production bundle
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:cov -- --maxWorkers=2

      - name: Ensure badges folder
        run: mkdir -p badges

      - name: Read coverage percentage
        id: cov
        run: |
          COV_INT=$(jq -r '.total.lines.pct|floor' coverage/coverage-summary.json)
          if [ "$COV_INT" -ge 90 ]; then COLOR=brightgreen;
          elif [ "$COV_INT" -ge 80 ]; then COLOR=green;
          elif [ "$COV_INT" -ge 70 ]; then COLOR=yellowgreen;
          elif [ "$COV_INT" -ge 60 ]; then COLOR=yellow;
          else COLOR=orange; fi
          echo "pct=$COV_INT" >> "$GITHUB_OUTPUT"
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"

      - name: Generate coverage badge
        uses: emibcn/badge-action@v2
        with:
          label: coverage
          status: '${{ steps.cov.outputs.pct }}%'
          color: '${{ steps.cov.outputs.color }}'
          path: badges/coverage.svg

      - name: Commit coverage badge (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          git diff --cached --quiet || git commit -m "ci: update coverage badge"
          git push
