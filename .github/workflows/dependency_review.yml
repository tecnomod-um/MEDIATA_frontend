name: Dependency Review

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Audit all installed dependencies
        run: npm audit --audit-level=low
